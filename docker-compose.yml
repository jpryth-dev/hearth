# Local development database. Host port 5433 avoids clashing with a
# locally installed Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: hearth
      POSTGRES_DB: hearth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hearth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches all outgoing mail in development. Inbox UI: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # S3-compatible object storage for photos. Private by default: objects are
  # reachable only through signed URLs.
  storage:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: hearth
      RUSTFS_SECRET_KEY: hearth-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - hearth-storage:/data

volumes:
  hearth-db:
  hearth-storage:
